name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml so a release runs exactly the same checks

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Generated CSS is gitignored, so a fresh checkout must build it before anything that loads app styles.
      # This checks references, theme parity and contrast first, then builds.
      - name: Check and build design tokens
        run: npm run tokens

      - name: Unit and axe tests (library)
        run: npx ng test ng-a11y --watch=false

      - name: Unit tests (demo app)
        run: npx ng test sandbox --watch=false

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      # The Playwright web server builds tokens and the library first, so this also covers the package contents.
      - name: End-to-end tests (Chromium and WebKit)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
