<main>
  <h1>&#64;colemanto/ng-a11y</h1>
  <p>Toast / snackbar demo. Use a screen reader to hear the announcements.</p>

  <p class="theme">
    <label for="theme">Theme</label>
    <select id="theme" (change)="setTheme($event)">
      @for (t of themes; track t.value) {
        <option [value]="t.value" [selected]="t.value === theme()">{{ t.label }}</option>
      }
    </select>
  </p>

  <div class="buttons">
    <button type="button" (click)="toast.info('Heads up: this is informational.')">Info</button>
    <button type="button" (click)="toast.success('Your changes were saved.')">Success</button>
    <button type="button" (click)="toast.warning('Your session expires soon.')">Warning</button>
    <button type="button" (click)="toast.error('Could not save your changes.')">Error (assertive)</button>
    <button
      type="button"
      (click)="toast.info('Item deleted.', { duration: 0, action: { label: 'Undo', handler: undo } })"
    >
      With action (persistent)
    </button>
  </div>
</main>

<a11y-toast-container />
<router-outlet />
